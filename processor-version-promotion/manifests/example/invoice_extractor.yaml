# Example of manifests/prod/invoice_extractor.yaml, the version pin for one processor in one
# environment. scripts/export_processor.py writes these files; you review them in a pull request.
# Terraform reads every *.yaml in the folder named by manifests_dir (environments/<env>.tfvars),
# so this example folder is never applied.
processor_key: "invoice_extractor"
display_name: "invoice-extractor-prod"
processor_type: "CUSTOM_EXTRACTION_PROCESSOR"
# Day 0 only: set to the ID of a destination processor that already exists so Terraform
# adopts it instead of creating a new one. Delete this line after the first apply.
# existing_processor_id: ""
location: "us"
source_project_id: "my-training-project"
source_processor: "projects/my-training-project/locations/us/processors/1a2b3c4d5e6f7a8b"
# Approved version to promote: the evaluated version ID in the training project.
source_version_id: "9f8e7d6c5b4a3921"
version_display_name: "invoice-extractor-v7"
versions_mode: "default"
schema_file: "schemas/invoice_extractor/invoice-extractor-v7.schema.json"
deploy: true
set_default: true
copy_dataset: false
