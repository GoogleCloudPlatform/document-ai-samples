name: Tax Processing Pipeline Python Sample
on:
  push:
    branches:
      - main
    paths:
      - "tax-processing-pipeline-python/**"
      - ".github/workflows/tax-processing-pipeline-python.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "tax-processing-pipeline-python/**"
      - ".github/workflows/tax-processing-pipeline-python.yaml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tax-processing-pipeline-python
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests (offline, no Google Cloud calls)
        run: |
          python main_test.py
