name: Processor Version Promotion Sample
on:
  push:
    branches:
      - main
    paths:
      - "processor-version-promotion/**"
      - ".github/workflows/processor-version-promotion.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "processor-version-promotion/**"
      - ".github/workflows/processor-version-promotion.yaml"
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./processor-version-promotion
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt
      - name: Run unit tests (offline, no Google Cloud calls)
        run: |
          python tests/test_version_map.py
          python tests/test_default_switch.py
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./processor-version-promotion
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate
        run: |
          terraform init -backend=false -input=false
          terraform validate
